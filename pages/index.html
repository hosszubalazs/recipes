<!DOCTYPE html>
<html>
<head>
    <title>Deployment Champion!</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px; 
            background: #f0f8ff;
        }
        .trophy { 
            font-size: 4em; 
            margin: 20px; 
        }
        .counter { 
            font-size: 3em; 
            color: #2c5aa0; 
            font-weight: bold;
        }
        button { 
            padding: 15px 30px; 
            font-size: 1.2em; 
            background: #4CAF50; 
            color: white; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer;
        }
        .team-name {
            color: #ff6b6b;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="trophy">🏆</div>
    <h1>Deployment Champion!</h1>
    <p>Team <span class="team-name" id="teamName">Awesome Testers</span> is rocking CI/CD!</p>
    
    <div class="counter" id="deployCount">0</div>
    <p>Successful Deployments</p>
    
    <button onclick="celebrateDeployment()">🎉 New Deployment!</button>
    
    <div style="margin-top: 30px;">
        <p>🚀 Next mission: Master GitHub Actions</p>
        <p>💡 Pro tip: Every deployment makes you better!</p>
    </div>

    <script>
        let count = 0;
        
        function celebrateDeployment() {
            count++;
            document.getElementById('deployCount').textContent = count;
            
            // Simple celebration
            alert(`🎊 Deployment #${count} successful! You're amazing!`);
            
            // Change trophy occasionally
            const trophies = ['🏆', '⭐', '🚀', '💻', '👑'];
            document.querySelector('.trophy').textContent = 
                trophies[Math.floor(Math.random() * trophies.length)];
        }
        
        // Optional: Get team name from URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const team = urlParams.get('team');
        if (team) {
            document.getElementById('teamName').textContent = team;
        }
    </script>
</body>
</html>
