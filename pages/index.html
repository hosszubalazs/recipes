<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Upload Test Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            line-height: 1.6;
        }
        .upload-container {
            background-color: #f4f4f4;
            padding: 30px;
            border-radius: 8px;
            margin-bottom: 30px;
        }
        input[type="file"] {
            margin: 10px 0;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .presentation {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <h1>Document Upload Test</h1>

    <div class="upload-container">
        <h2>Upload a Document</h2>
        <!-- The form uses the POST method and multipart/form-data encoding for file uploads -->
        <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">
            <label for="fileToUpload"><strong>Choose a file to upload:</strong></label><br>
            <input type="file" id="fileToUpload" name="fileToUpload" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png"><br><br>
            <button type="submit">Upload File</button>
        </form>
    </div>

    <div class="presentation">
        <h2>Upload Status</h2>
        <p>After you submit the form, the page will redirect to a confirmation page from <a href="https://httpbin.org" target="_blank">https://httpbin.org</a>. This demonstrates that the file was successfully sent.</p>
        <p>You can use this area to present results or information about the uploaded document.</p>
    </div>

</body>
</html>
